# The scenario manifests upstream's setup-kubernetes-goat.sh applies, in its order, unchanged,
# with one difference: upstream's images have no tag (so `latest`, pulled at every start), and
# here each is pinned to the digest `latest` had at release v2.3.0 (pushed 2022-05 to 2024-09,
# none since). Applied by provision/goat.sh with
# `kubectl kustomize --load-restrictor LoadRestrictionsNone`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kubernetes-goat/scenarios/batch-check/job.yaml
  - ../../kubernetes-goat/scenarios/build-code/deployment.yaml
  - ../../kubernetes-goat/scenarios/cache-store/deployment.yaml
  - ../../kubernetes-goat/scenarios/health-check/deployment.yaml
  - ../../kubernetes-goat/scenarios/hunger-check/deployment.yaml
  - ../../kubernetes-goat/scenarios/internal-proxy/deployment.yaml
  - ../../kubernetes-goat/scenarios/kubernetes-goat-home/deployment.yaml
  - ../../kubernetes-goat/scenarios/poor-registry/deployment.yaml
  - ../../kubernetes-goat/scenarios/system-monitor/deployment.yaml
  - ../../kubernetes-goat/scenarios/hidden-in-layers/deployment.yaml
images:
